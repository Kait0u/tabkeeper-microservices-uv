# --------------------------------------------------------------------------------------------------
# Notification Service Config
# --------------------------------------------------------------------------------------------------

tabkeeper:
  notification-service:
    email:
      from-email: "notifications@tabkeeper.local"
  grpc:
    discovery-refresh-interval: ${GRPC_DISCOVERY_REFRESH_INTERVAL:PT5S}

# --------------------------------------------------------------------------------------------------
# Spring Boot config
# --------------------------------------------------------------------------------------------------


spring:
  application:
    name: tabkeeper-notification-service

  cloud:
    config:
      enabled: false

  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:tabkeeper}
    password: ${RABBITMQ_PASSWORD}

  mail:
    host: ${MAILPIT_HOST:mailpit}
    port: ${MAILPIT_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}


logging:
  level:
    root: INFO
    pl.kaitoudev.tabkeeper: DEBUG