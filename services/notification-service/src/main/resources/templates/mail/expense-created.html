<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabkeeper notification</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f3f6fa;font-family:Arial,Helvetica,sans-serif;color:#172b3a;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="width:600px;max-width:100%;background-color:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 4px 16px rgba(23,43,58,0.08);">
            <tr>
              <td style="padding:22px 32px;background-color:#0f766e;color:#ffffff;">
                <div style="font-size:12px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;">Tabkeeper</div>
              </td>
            </tr>
            <tr>
              <td style="padding:32px;">
                <div style="display:inline-block;margin-bottom:16px;padding:6px 10px;border-radius:6px;background-color:#e6f5f1;color:#0f766e;font-size:12px;font-weight:bold;letter-spacing:0.5px;text-transform:uppercase;">New expense</div>
                <h1 style="margin:0 0 16px;font-size:26px;line-height:34px;color:#172b3a;">A new expense was recorded in <span th:text="${groupName}">Group</span></h1>
                <p style="margin:0 0 24px;font-size:16px;line-height:26px;color:#425466;">
                  Hello <span th:text="${recipientDisplayName}">User</span>, a new expense in <span th:text="${groupName}">Group</span> includes an allocated share for you.
                </p>
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin-bottom:24px;background-color:#f8fafc;border:1px solid #e5eaf0;border-radius:8px;">
                  <tr>
                    <td style="padding:20px 24px;">
                      <div style="margin-bottom:4px;font-size:12px;font-weight:bold;letter-spacing:1px;text-transform:uppercase;color:#6b7a89;">Your allocated share</div>
                      <div th:text="|${recipientAllocatedAmount} ${currency}|" style="font-size:28px;font-weight:bold;line-height:36px;color:#0f766e;">40.00 USD</div>
                    </td>
                  </tr>
                </table>
                <h2 style="margin:0 0 12px;font-size:17px;line-height:24px;color:#172b3a;">Participant shares</h2>
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="border-collapse:collapse;font-size:14px;line-height:22px;">
                  <tr>
                    <th align="left" style="padding:10px 12px;border-bottom:2px solid #e5eaf0;color:#6b7a89;font-size:12px;letter-spacing:0.5px;text-transform:uppercase;">Participant</th>
                    <th align="right" style="padding:10px 12px;border-bottom:2px solid #e5eaf0;color:#6b7a89;font-size:12px;letter-spacing:0.5px;text-transform:uppercase;">Share</th>
                  </tr>
                  <tr th:each="participant : ${participants}">
                    <td th:text="${participant.displayName}" style="padding:12px;border-bottom:1px solid #e5eaf0;color:#425466;">User</td>
                    <td th:text="|${participant.allocatedAmount} ${currency}|" align="right" style="padding:12px;border-bottom:1px solid #e5eaf0;color:#172b3a;font-weight:bold;">40.00 USD</td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:18px 32px;background-color:#f8fafc;border-top:1px solid #e5eaf0;">
                <p style="margin:0;font-size:12px;line-height:20px;color:#6b7a89;">You’re receiving this because you’re a participant in a Tabkeeper group expense.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
