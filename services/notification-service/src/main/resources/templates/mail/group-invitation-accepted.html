<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabkeeper notification</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f3f6fa;font-family:Arial,Helvetica,sans-serif;color:#172b3a;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="width:600px;max-width:100%;background-color:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 4px 16px rgba(23,43,58,0.08);">
            <tr>
              <td style="padding:22px 32px;background-color:#0f766e;color:#ffffff;">
                <div style="font-size:12px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;">Tabkeeper</div>
              </td>
            </tr>
            <tr>
              <td style="padding:32px;">
                <div style="display:inline-block;margin-bottom:16px;padding:6px 10px;border-radius:6px;background-color:#e6f5f1;color:#0f766e;font-size:12px;font-weight:bold;letter-spacing:0.5px;text-transform:uppercase;">New member</div>
                <h1 style="margin:0 0 16px;font-size:26px;line-height:34px;color:#172b3a;">
                  Your invitation was accepted
                </h1>
                <p style="margin:0 0 24px;font-size:16px;line-height:26px;color:#425466;">
                  <strong th:text="${invitedUserDisplayName}">User</strong> has joined <strong th:text="${groupName}">Group</strong>. Your group is ready for more shared adventures.
                </p>
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#f8fafc;border:1px solid #e5eaf0;border-radius:8px;">
                  <tr>
                    <td style="padding:20px 24px;">
                      <div style="margin-bottom:6px;font-size:12px;font-weight:bold;letter-spacing:1px;text-transform:uppercase;color:#6b7a89;">Now available</div>
                      <div style="font-size:15px;line-height:25px;color:#425466;">
                        Add expenses, assign participant shares, and keep everyone’s balances up to date.
                      </div>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:18px 32px;background-color:#f8fafc;border-top:1px solid #e5eaf0;">
                <p style="margin:0;font-size:12px;line-height:20px;color:#6b7a89;">You’re receiving this because your Tabkeeper group invitation was accepted.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
