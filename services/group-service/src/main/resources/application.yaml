spring:
  application:
    name: tabkeeper-group-service

  cloud:
    config:
      enabled: false

  # DB
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

  # GRPC
  grpc:
    server:
      port: 9090

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    non-secure-port: ${spring.grpc.server.port}
    metadata-map:
      gRPC_port: ${spring.grpc.server.port}

logging:
  level:
    root: INFO
    pl.kaitoudev.tabkeeper: DEBUG