spring:
  application:
    name: tabkeeper-user-service
  cloud:
    config:
      enabled: false

  # DB
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

  # GRPC
  grpc:
    server:
      port: 9090

logging:
  level:
    root: INFO
    pl.kaitoudev.tabkeeper: DEBUG
