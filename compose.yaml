name: tabkeeper

services:
  # ================================================================================================
  # Gateway
  # ================================================================================================
  gateway:
    build:
      context: .
      dockerfile: infra/gateway/Dockerfile
    image: tabkeeper-gateway
    labels:
      dev.tabkeeper.logs: "true"
    ports: [ "8080:8080" ]
    environment:
      EUREKA_URL: http://discovery:8761/eureka/

  # ================================================================================================
  # Discovery (Eureka)
  # ================================================================================================

  discovery:
    build:
      context: .
      dockerfile: infra/discovery/Dockerfile
    image: tabkeeper-discovery
    labels:
      dev.tabkeeper.logs: "true"
    ports: [ "8761:8761" ]
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8761/actuator/health || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  # ================================================================================================
  # User Service
  # ================================================================================================
  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    image: tabkeeper-user-service
    labels:
      dev.tabkeeper.logs: "true"
    ports: [ "9090:9090" ]
    environment:
      EUREKA_URL: http://discovery:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-user-service:5432/user_service
      SPRING_DATASOURCE_USERNAME: us
      SPRING_DATASOURCE_PASSWORD: ${USER_DB_PASSWORD:?Required}
    depends_on:
      db-user-service:
        condition: service_healthy

  db-user-service:
    image: postgres:18-alpine
    ports: [ "5432:5432" ]
    environment:
      POSTGRES_DB: user_service
      POSTGRES_USER: us
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:?Required}
    volumes: [ tabkeeper_user_service_postgres_data:/var/lib/postgresql ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U us -d user_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ================================================================================================
  # Group Service
  # ================================================================================================
  group-service:
    build:
      context: .
      dockerfile: services/group-service/Dockerfile
    image: tabkeeper-group-service
    labels:
      dev.tabkeeper.logs: "true"
    ports: [ "9091:9090" ]
    environment:
      EUREKA_URL: http://discovery:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-group-service:5432/group_service
      SPRING_DATASOURCE_USERNAME: gs
      SPRING_DATASOURCE_PASSWORD: ${GROUP_DB_PASSWORD:?Required}
    depends_on:
      db-group-service:
        condition: service_healthy

  db-group-service:
    image: postgres:18-alpine
    ports: [ "5433:5432" ]
    environment:
      POSTGRES_DB: group_service
      POSTGRES_USER: gs
      POSTGRES_PASSWORD: ${GROUP_DB_PASSWORD:?Required}
    volumes: [ tabkeeper_group_service_postgres_data:/var/lib/postgresql ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U gs -d group_service" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # ================================================================================================
  # Expense Service
  # ================================================================================================
  expense-service:
    build:
      context: .
      dockerfile: services/expense-service/Dockerfile
    image: tabkeeper-expense-service
    labels:
      dev.tabkeeper.logs: "true"
    ports: [ "9092:9090" ]
    environment:
      EUREKA_URL: http://discovery:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-expense-service:5432/expense_service
      SPRING_DATASOURCE_USERNAME: es
      SPRING_DATASOURCE_PASSWORD: ${EXPENSE_DB_PASSWORD:?Required}
    depends_on:
      db-expense-service:
        condition: service_healthy

  db-expense-service:
    image: postgres:18-alpine
    ports: [ "5434:5432" ]
    environment:
      POSTGRES_DB: expense_service
      POSTGRES_USER: es
      POSTGRES_PASSWORD: ${EXPENSE_DB_PASSWORD:?Required}
    volumes: [ tabkeeper_expense_service_postgres_data:/var/lib/postgresql ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U es -d expense_service" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # ================================================================================================
  # Notification Service
  # ================================================================================================
  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    image: tabkeeper-notification-server
    labels:
      dev.tabkeeper.logs: "true"
    ports: [ "9093:9090" ]
    networks:
      - default
      - mailpit
    environment:
      EUREKA_URL: http://discovery:8761/eureka/
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: tabkeeper-app
      RABBITMQ_PASSWORD: ${RABBITMQ_APP_PASSWORD:?Required}


  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    restart: unless-stopped
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8025:8025"
    networks: [ mailpit ]
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  rabbitmq:
    image: rabbitmq:latest
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: tabkeeper
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Required}
    configs:
      - source: rabbitmq-plugins
        target: /etc/rabbitmq/enabled_plugins
      - source: rabbitmq-config
        target: /etc/rabbitmq/rabbitmq.conf
      - source: rabbitmq-definitions
        target: /etc/rabbitmq/definitions.json
    volumes:
      - tabkeeper_rabbitmq_data:/var/lib/rabbitmq
      - tabkeeper_rabbitmq_logs:/var/log/rabbitmq


  # ================================================================================================
  # Observability
  # ================================================================================================
  dozzle:
    image: amir20/dozzle:main-alpine
    ports: [ "9999:8080" ]
    environment:
      DOZZLE_FILTER: "label=dev.tabkeeper.logs=true"
    volumes: [ /var/run/docker.sock:/var/run/docker.sock:ro ]

  # ================================================================================================
  # To Be Continued...
  # ================================================================================================

configs:
  rabbitmq-plugins:
    content: "[rabbitmq_management]."
  rabbitmq-config:
    file: ./docker/rabbitmq/rabbitmq.conf
  rabbitmq-definitions:
    file: ./docker/rabbitmq/definitions.json

volumes:
  tabkeeper_user_service_postgres_data: {}
  tabkeeper_group_service_postgres_data: {}
  tabkeeper_expense_service_postgres_data: {}
  tabkeeper_rabbitmq_data: {}
  tabkeeper_rabbitmq_logs: {}

networks:
  default: {}
  mailpit: {}