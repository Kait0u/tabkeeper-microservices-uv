opencollection: 1.0.0

info:
  name: Tabkeeper
config:
  protobuf:
    protoFiles:
      - type: file
        path: ../../contracts/user-contracts/src/main/proto/tabkeeper/user/v1/user_service.proto
      - type: file
        path: ../../contracts/group-contracts/src/main/proto/tabkeeper/group/v1/group_service.proto
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
