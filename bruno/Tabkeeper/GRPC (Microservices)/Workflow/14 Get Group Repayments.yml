info:
  name: 14 Get Group Repayments
  type: grpc
  seq: 14

grpc:
  url: "{{urlExpenseService}}"
  method: /tabkeeper.expense.v1.ExpenseService/GetAllRepaymentsInGroup
  methodType: unary
  protoFilePath: ../../contracts/expense-contracts/src/main/proto/tabkeeper/expense/v1/expense_service.proto
  message:
    - title: message 1
      message: |-
        {
          "group_id": "{{groupId}}"
        }
  auth: inherit

runtime:
  scripts:
    - type: grpc:after-message-receive
      code: |
        const data = bru.grpc.response.message.data;
        test("Group history contains the repayment", function () {
          expect(data.repayments).to.have.length(1);
          const repaymentId = data.repayments[0].repaymentId ?? data.repayments[0].repayment_id;
          expect(repaymentId).to.equal(bru.getVar("repaymentId"));
        });
    - type: grpc:after-call-end
      code: |
        test("Get Group Repayments succeeds", function () {
          expect(bru.grpc.response.statusCode).to.equal(0);
        });
