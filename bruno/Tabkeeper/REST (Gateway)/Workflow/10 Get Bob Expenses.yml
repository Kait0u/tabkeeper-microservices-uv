info:
  name: 10 Get Bob Expenses
  type: http
  seq: 10

http:
  method: GET
  url: http://localhost:8080/api/v1/groups/{{groupId}}/users/{{bobUserId}}/expenses
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Bob has one allocated expense and no paid expenses", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().expensesPaid).to.have.length(0);
          expect(res.getBody().expensesAllocated).to.have.length(1);
          expect(res.getBody().expensesAllocated[0].expenseId).to.equal(bru.getVar("expenseId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
