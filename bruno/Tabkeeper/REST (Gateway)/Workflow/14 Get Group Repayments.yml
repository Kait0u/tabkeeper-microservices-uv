info:
  name: 14 Get Group Repayments
  type: http
  seq: 14

http:
  method: GET
  url: http://localhost:8080/api/v1/groups/{{groupId}}/repayments
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Group history contains the repayment", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody()).to.have.length(1);
          expect(res.getBody()[0].repaymentId).to.equal(bru.getVar("repaymentId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
