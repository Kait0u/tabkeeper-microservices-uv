info:
  name: 09 Get Group Expenses
  type: http
  seq: 9

http:
  method: GET
  url: http://localhost:8080/api/v1/groups/{{groupId}}/expenses
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Group history contains the new expense", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody()).to.have.length(1);
          expect(res.getBody()[0].expenseId).to.equal(bru.getVar("expenseId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
