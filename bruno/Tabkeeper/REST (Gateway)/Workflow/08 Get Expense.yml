info:
  name: 08 Get Expense
  type: http
  seq: 8

http:
  method: GET
  url: http://localhost:8080/api/v1/expenses/{{expenseId}}
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Stored expense matches the workflow", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().expenseId).to.equal(bru.getVar("expenseId"));
          expect(res.getBody().groupId).to.equal(bru.getVar("groupId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
