info:
  name: 03 Create Group
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:8080/api/v1/groups
  body:
    type: json
    data: |-
      {
        "ownerId": "{{aliceUserId}}",
        "groupName": "Workflow {{$guid}}",
        "currencyCode": "USD"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("groupId", res.getBody().groupId);
    - type: tests
      code: |-
        test("Group is created in USD", function () {
          expect(res.getStatus()).to.equal(201);
          expect(res.getBody().groupId).to.be.a("string").with.length(36);
          expect(res.getBody().currencyCode).to.equal("USD");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
