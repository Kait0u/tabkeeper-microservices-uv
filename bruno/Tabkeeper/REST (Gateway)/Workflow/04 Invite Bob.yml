info:
  name: 04 Invite Bob
  type: http
  seq: 4

http:
  method: POST
  url: http://localhost:8080/api/v1/groups/{{groupId}}/invitations
  body:
    type: json
    data: |-
      {
        "invitedByUserId": "{{aliceUserId}}",
        "invitedUserId": "{{bobUserId}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("invitationId", res.getBody().invitationId);
    - type: tests
      code: |-
        test("Bob is invited", function () {
          expect(res.getStatus()).to.equal(201);
          expect(res.getBody().invitationId).to.be.a("string").with.length(36);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
