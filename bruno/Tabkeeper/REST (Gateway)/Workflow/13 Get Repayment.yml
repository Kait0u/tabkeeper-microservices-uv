info:
  name: 13 Get Repayment
  type: http
  seq: 13

http:
  method: GET
  url: http://localhost:8080/api/v1/groups/{{groupId}}/repayments/{{repaymentId}}
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Stored repayment retains its FIFO allocation", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().repaymentId).to.equal(bru.getVar("repaymentId"));
          expect(res.getBody().allocations).to.have.length(1);
          expect(res.getBody().allocations[0].originExpenseId).to.equal(bru.getVar("expenseId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
