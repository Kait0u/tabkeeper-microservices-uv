info:
  name: 15 Get Bob Repayments
  type: http
  seq: 15

http:
  method: GET
  url: http://localhost:8080/api/v1/groups/{{groupId}}/users/{{bobUserId}}/repayments
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Bob's history contains his repayment", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody()).to.have.length(1);
          expect(res.getBody()[0].repayingUserId).to.equal(bru.getVar("bobUserId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
