info:
  name: Get Expense Details
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:8080/api/v1/expenses/:expenseId
  params:
    - name: expenseId
      value: 00000000-0000-0000-0000-000000000000
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
