info:
  name: Create User
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:8080/api/v1/users
  body:
    type: json
    data: |-
      {
        "displayName": "Alice",
        "email": "alice@alicemail.com",
        "password": "VeryCoolPassword123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
