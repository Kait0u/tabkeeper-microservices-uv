syntax = "proto3";

import "google/protobuf/timestamp.proto";

package tabkeeper.users.v1;

option java_package = "pl.kaitoudev.tabkeeper.proto.user.v1";
option java_multiple_files = true;

service UserService {
  rpc CreateUser(CreateUserRequest) returns (UserInfo);
  rpc GetUser(GetUserRequest) returns (UserInfo);
}

// -----------------------------------------------------------------------------

// SHARED

message UserInfo {
  string user_id = 1;
  string display_name = 2;
  string email = 3;
  google.protobuf.Timestamp created_ts = 4;
}


// GetUser
message GetUserRequest {
  string user_id = 1;
}


// CreateUser
message CreateUserRequest {
  string display_name = 1;
  string email = 2;
  string password = 3;
}
