[versions]
spring-boot = "4.1.1"
spring-cloud = "2025.1.3"
spring-dependency-management = "1.1.7"
google-protobuf = "0.9.6"
spotless = "8.10.0"
google-java-format = "1.36.1"

[libraries]
# Spring BOM
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-cloud-bom = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }

# Spring Boot
spring-boot-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-grpc-client = { module = "org.springframework.boot:spring-boot-starter-grpc-client" }
spring-boot-grpc-server = { module = "org.springframework.boot:spring-boot-starter-grpc-server" }

# Spring Cloud
spring-cloud-config = { module = "org.springframework.cloud:spring-cloud-starter-config" }
spring-cloud-gateway = { module = "org.springframework.cloud:spring-cloud-starter-gateway-server-webmvc" }

# Lombok
lombok = { module = "org.projectlombok:lombok" }

# Database
spring-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
postgresql = { module = "org.postgresql:postgresql" }
flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }

# Protobuf
google-protobuf-gradle-plugin = { module = "com.google.protobuf:protobuf-gradle-plugin", version.ref = "google-protobuf" }

# Testcontainers
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }

# Testing
spring-boot-actuator-test = { module = "org.springframework.boot:spring-boot-starter-actuator-test" }
spring-boot-grpc-client-test = { module = "org.springframework.boot:spring-boot-starter-grpc-client-test" }
spring-boot-grpc-server-test = { module = "org.springframework.boot:spring-boot-starter-grpc-server-test" }
spring-data-jpa-test = { module = "org.springframework.boot:spring-boot-starter-data-jpa-test" }
flyway-test = { module = "org.springframework.boot:spring-boot-starter-flyway-test" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

# Gradle plugins
spring-boot-gradle-plugin = { module = "org.springframework.boot:org.springframework.boot.gradle.plugin", version.ref = "spring-boot" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:com.diffplug.spotless.gradle.plugin", version.ref = "spotless" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
google-protobuf = { id = "com.google.protobuf", version.ref = "google-protobuf" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
